# Production-style stack: MongoDB + API + web (nginx). The blockchain is external (e.g. Polygon Amoy).
#   cp .env.docker.example .env.docker   (edit it)
#   docker compose up --build
# Open http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]

  server:
    build: ./server
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MONGO_URI: mongodb://mongo:27017/vouch
      PORT: "5000"
    depends_on: [mongo]

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [server]

volumes:
  mongo-data:
